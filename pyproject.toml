[project]
name = "faultaudit"
version = "0.1.0"
description = "AI corporate-finance audit agent (Vertex AI Agent Builder + MongoDB)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["faultaudit"]
omit = ["faultaudit/agent/agent.py"]  # thin assembly; covered by integration, not unit
